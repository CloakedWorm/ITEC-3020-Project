<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>News Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            background-image: none;
            text-align: center;
            min-height: 20vh;
        }

        .hero_content {
            color: #1F2937;
            background: #8B639B;
            border-radius: 12px;
            padding: 2rem;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="header_placeholder"></div>
    <main>
        <section class="hero">
            <div class="hero_content">
                <h1>Latest News</h1>
                <p>
                    Stay updated with the latest news and developments from CloverField Technologies.
                </p>
            </div>
        </section>
        <section class="news">
            <input type="text" id="filter-input" placeholder="Search news..."
            style="padding:5px;
            margin:auto;">

            <p id="no-results" style="display:none;">
                No results found.
            </p>
            <div id="news_main">
                <!--Load blog post via json file-->
            </div>
        </section>
    </main>
    <div id="footer_placeholder"></div>
    <script src="components.js"></script>
    <script src="theme.js"></script>
    <script src="news.js"></script>
    <script src="query.js"></script>
</body>

</html>
