<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero{
            background-image: none;
            text-align: center;
            min-height: 20vh;
        }
        .hero_content{
            color: #1F2937;
            background: #8B639B;
            border-radius: 12px;
            padding: 2rem;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="header_placeholder"></div>
    <main>
        <section class="hero">
            <div class="hero_content">
                <h1>Contact CloverField Technologies</h1>
                <p>
                    We value your feedback and inquiries. Please fill out the form below to get in touch with us.
                </p>
            </div>
        </section>
        <section class="form">
        <h1>Contact Us</h1>
        <form id="contact-form">
            <input id="name" type="text" placeholder="Name"></input>
            <span class="error-msg"></span>

            <input id="email" type="text" placeholder="Email"></input>
            <span class="error-msg"></span>

            <input id="subject" type="text" placeholder="Subject"></input>
            <textarea id="message" placeholder="Message"></textarea>
            <span class="error-msg"></span>

            <button type="submit" class="button">Submit</button>
        </form>
        </section>
    </main>
    <div id="footer_placeholder"></div>
    <script src="components.js"></script>
    <script src="theme.js"></script>
    <script src="contact_val.js"></script>
</body>

</html>
